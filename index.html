<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zaki</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;font-family:'Inter',sans-serif;display:flex;justify-content:center;min-height:100dvh;color:#fff}
.chat{position:relative;width:100%;max-width:430px;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;
background:repeating-linear-gradient(90deg,#0c0c0d 0px,#0c0c0d 10px,#161617 11px,#161617 12px,#080808 13px,#080808 22px),#000}
.chat:before{content:'';position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 110%,rgba(255,120,30,.38),transparent 50%),rgba(0,0,0,.25);pointer-events:none}
.chat>*{position:relative;z-index:1}
@media(min-width:480px){.chat{height:100dvh;border-left:1px solid rgba(255,150,50,.25);border-right:1px solid rgba(255,150,50,.25);box-shadow:0 0 80px rgba(255,110,0,.18)}}

.head{margin:28px 18px 0;padding:16px 18px;display:flex;align-items:center;gap:15px;
background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
backdrop-filter:blur(28px) saturate(160%);border-radius:26px;border:1.2px solid rgba(255,170,90,.85);
box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 28px rgba(255,120,20,.32)}
.avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:center 12%;background:#000;flex-shrink:0;border:1px solid rgba(255,140,0,.5);box-shadow:0 0 24px rgba(255,120,0,.8),0 0 0 4px rgba(255,255,255,.06)}
.info{flex:1}.info h1{font-size:26px;font-weight:600}.info .st{font-size:15px;margin-top:6px;color:#D8D8DE}.info .st b{color:#FF9B4A}

/* СТЕКЛЯННЫЙ СКРОЛЛ - НЕ БЕЛЫЙ, А СТЕКЛО */
#msgs{flex:1;overflow-y:auto;padding:42px 14px 14px 18px;display:flex;flex-direction:column;gap:24px;
scrollbar-width:thin;scrollbar-color:rgba(255,170,90,.6) transparent}
#msgs::-webkit-scrollbar{width:6px;display:block}
#msgs::-webkit-scrollbar-track{background:transparent}
#msgs::-webkit-scrollbar-thumb{
background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
backdrop-filter:blur(10px);
border:1px solid rgba(255,170,90,.6);
border-radius:100px;
box-shadow:0 0 12px rgba(255,120,20,.35), inset 0 1px 0 rgba(255,255,255,.25);
}
#msgs::-webkit-scrollbar-thumb:hover{background:rgba(255,170,90,.45)}

.row{display:flex;gap:12px;align-items:flex-start;max-width:88%}
.mini{width:52px;height:52px;min-width:52px;border-radius:50%;object-fit:cover;object-position:center 12%;background:#000;box-shadow:0 0 18px rgba(255,120,0,.65);border:1px solid rgba(255,140,0,.4)}
.msg{padding:19px 20px;font-size:16.5px;line-height:1.55;border-radius:26px;word-break:break-word;
background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
backdrop-filter:blur(22px);border:1.2px solid rgba(255,170,90,.75);
box-shadow:0 0 22px rgba(255,110,0,.22),inset 0 1px 0 rgba(255,255,255,.22)}
.msg a{color:#FFB26B;word-break:break-all}
.msg.user{align-self:flex-end;margin-left:auto;background:linear-gradient(135deg,rgba(50,50,55,.6),rgba(20,20,22,.6))}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:50px}
.bigWrap{width:118px;height:118px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#FF9E45,rgba(255,255,255,.1));box-shadow:0 0 40px rgba(255,120,0,.5)}
.bigWrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 12%;background:#000}
.empty h2{font-size:27px;font-weight:600;margin-top:22px}
.empty p{font-size:14.5px;color:#A8A8B0;margin-top:8px;line-height:1.6}
.glassHint{margin-top:18px;padding:10px 16px;border-radius:100px;background:rgba(255,255,255,.07);border:1px solid rgba(255,170,90,.4);backdrop-filter:blur(12px);font-size:13px}
.bottom{padding:12px 18px 26px}
.inputWrap{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 22px;border-radius:100px;
background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
backdrop-filter:blur(24px);border:1.2px solid rgba(255,170,90,.75);box-shadow:0 0 24px rgba(255,110,0,.22)}
.inputWrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16.5px;padding:15px 0;min-width:0}
.inputWrap input::placeholder{color:#9A9AA3}
.send{width:52px;height:52px;min-width:52px;border-radius:50%;background:linear-gradient(135deg,#FF9A35,#FF6A00);border:none;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 22px rgba(255,106,0,.55)}
.chips{display:flex;gap:8px;padding:0 18px 12px;flex-wrap:wrap}
.chips span{font-size:13px;padding:10px 14px;border-radius:100px;background:rgba(255,255,255,.07);border:1px solid rgba(255,170,90,.45);backdrop-filter:blur(12px);cursor:pointer}
</style>
</head>
<body>
<div class="chat">
  <div class="head">
    <img class="avatar" src="zaki.jpg">
    <div class="info"><h1>Zaki</h1><div class="st"><b>В сети</b> • Активен сейчас</div></div>
  </div>

  <div id="msgs">
    <div class="empty" id="empty">
      <div class="bigWrap"><img src="zaki.jpg"></div>
      <h2>Привет, я Zaki</h2>
      <p>Чем помочь?<br>Скорость, приватность</p>
      <div class="glassHint">✨ Напиши ниже — я на связи</div>
    </div>
  </div>

  <div class="chips">
    <span onclick="quick('Как скачать приложение?')">📲 Скачать приложение</span>
    <span onclick="quick('Тарифы?')">💳 Тарифы</span>
  </div>

  <div class="bottom">
    <div class="inputWrap">
      <input id="inp" placeholder="Написать Zaki..." autocomplete="off">
      <button class="send" onclick="askZaki()">➤</button>
    </div>
  </div>
</div>

<script>
// ===== ТВОЙ ДИЗАЙН НЕ ТРОГАЕМ - ТОЛЬКО НОВЫЙ УМНЫЙ МОЗГ =====
const RENDER_URL = "https://ТВОЯ-ССЫЛКА-RENDER.onrender.com"; // <-- СЮДА ВСТАВЬ СВОЮ ССЫЛКУ RENDER!

const inp = document.getElementById('inp');
const msgs = document.getElementById('msgs');
const emptyDiv = document.getElementById('empty');

function hideEmpty(){
  if(emptyDiv) emptyDiv.style.display='none';
}

function addMsg(text, who){
  hideEmpty();
  if(who==='user'){
    let div=document.createElement('div');
    div.className='msg user';
    div.textContent=text;
    msgs.appendChild(div);
  } else {
    let row=document.createElement('div');
    row.className='row';
    row.innerHTML=`<img class="mini" src="zaki.jpg"><div class="msg"></div>`;
    row.querySelector('.msg').textContent=text;
    msgs.appendChild(row);
    row.querySelector('.msg').innerHTML = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
  }
  msgs.scrollTop=msgs.scrollHeight;
  // вернуть элемент для обновления текста
  return msgs.lastElementChild.querySelector ? (msgs.lastElementChild.querySelector('.msg') || msgs.lastElementChild) : msgs.lastElementChild;
}

async function askZaki(){
  let q = inp.value.trim();
  if(!q) return;
  addMsg(q,'user');
  inp.value='';
  let bubble = addMsg('Zaki думает...','bot');
  let low = q.toLowerCase();

  // БЫСТРЫЕ ТОЧНЫЕ ОТВЕТЫ ПРО HS1VPN - ЧТОБЫ НЕ ЖДАТЬ ИИ
  if(low.includes('скачать') || low.includes('приложение') || low.includes('apk')){
    bubble.innerHTML='📲 Скачать HS1VPN для Android:<br><br><a href="https://github.com/safarovclub-ops/HS1VPN/releases/download/v1.0/HSOneVPN12.apk" target="_blank">https://github.com/safarovclub-ops/HS1VPN/releases/download/v1.0/HSOneVPN12.apk</a><br><br>Потом: внизу справа АККАУНТ > Зарегистрироваться > Email + пароль = 5ГБ бесплатно!';
    return;
  }
  if(low.includes('тариф') || low.includes('цен') || low.includes('139') || low.includes('399') || low.includes('699') || low.includes('сколько')){
    bubble.textContent='💳 Тарифы HS1VPN:\n\n1 месяц - 139р\n3 месяца - 399р\n6 месяцев - 699р\n\nОплата только в приложении!\nДиректор: @HS1family\nКанал: @HS1group';
    return;
  }
  if(low.includes('бесплатно') || low.includes('5 гб') || low.includes('5гб') || low.includes('регистр')){
    bubble.innerHTML='🎁 5ГБ бесплатно - легко!<br><br>1. Скачай приложение<br>2. Внизу справа кнопка АККАУНТ<br>3. Нажми Зарегистрироваться<br>4. Введи Email и пароль<br>Готово, 5ГБ твои!';
    return;
  }
  if(low.includes('оплат') || low.includes('купить') || low.includes('не приш')){
    bubble.textContent='⚠️ ВАЖНО при оплате!\n\nВ окне оплаты вводи ТОТ ЖЕ Email, который вводил при регистрации!\nЕсли другой Email - подписка не придет!\nОплата только в приложении.\nЕсли не пришло - пиши @HS1family с чеком.';
    return;
  }

  // УМНЫЙ ИИ ЧЕРЕЗ RENDER + GROQ - КЛЮЧ СПРЯТАН, НЕ ЗАБАНЯТ!
  try{
    let r = await fetch(RENDER_URL + '/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({q: q})
    });
    let j = await r.json();
    bubble.textContent = j.answer || 'Бро, повтори?';
  }catch(e){
    // ЗАПАСНОЙ МОЗГ ЕСЛИ RENDER СПИТ - ЧТОБЫ ВСЕГДА ОТВЕЧАЛ
    try{
      let system = "Ты Zaki, помощник HS1VPN. Отвечай коротко, по-братски. HS1VPN: директор @HS1family, канал @HS1group, скачать https://github.com/safarovclub-ops/HS1VPN/releases/download/v1.0/HSOneVPN12.apk, тарифы 139р/399р/699р, 5ГБ бесплатно через регистрацию в приложении внизу справа АККАУНТ, при оплате тот же Email.";
      let r2 = await fetch('https://text.pollinations.ai/'+encodeURIComponent(system+"\nВопрос: "+q));
      let t = await r2.text();
      bubble.textContent = t.trim();
    }catch(e2){
      bubble.textContent='Связь тупит, попробуй ещё раз! По HS1VPN пиши @HS1family';
    }
  }
  msgs.scrollTop=msgs.scrollHeight;
}

function quick(t){ inp.value=t; askZaki(); }
inp.addEventListener('keydown', e=>{ if(e.key==='Enter') askZaki(); });
</script>
</body>
</html>
