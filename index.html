<style>

<body>

<script>
const RENDER_URL="https://hs1vpn-bot-1.onrender.com";
const inp=document.getElementById('inp'), msgs=document.getElementById('msgs'), emptyDiv=document.getElementById('empty');
function hideEmpty(){if(emptyDiv)emptyDiv.style.display='none'}
function addMsg(t,w){
  hideEmpty();
  if(w==='user'){let d=document.createElement('div');d.className='msg user';d.textContent=t;msgs.appendChild(d);}
  else{let r=document.createElement('div');r.className='row';r.innerHTML=`<img class="mini" src="zaki.jpg" onerror="this.src='zaki.png'"><div class="msg"></div>`;r.querySelector('.msg').textContent=t;msgs.appendChild(r);r.querySelector('.msg').innerHTML=t.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>');}
  msgs.scrollTop=msgs.scrollHeight;
}
function addTyping(){hideEmpty();let r=document.createElement('div');r.className='row';r.innerHTML=`<img class="mini" src="zaki.jpg"><div class="msg"><div class="typing"><i></i><i></i><i></i></div></div>`;msgs.appendChild(r);msgs.scrollTop=msgs.scrollHeight;return r;}
async function askZaki(){let q=inp.value.trim();if(!q)return;addMsg(q,'user');inp.value='';let tr=addTyping();let low=q.toLowerCase();
if(low.includes('скачать')){setTimeout(()=>{tr.remove();let b=addMsg('','bot');b.innerHTML='📲 Скачать HS1VPN:<br><br><a href="https://github.com/safarovclub-ops/HS1VPN/releases/download/v1.0/HSOneVPN12.apk" target="_blank">https://github.com/safarovclub-ops/HS1VPN/releases/download/v1.0/HSOneVPN12.apk</a>';},600);return;}
if(low.includes('тариф')){setTimeout(()=>{tr.remove();addMsg('💳 Тарифы:\n1 мес - 139р\n3 мес - 399р\n6 мес - 699р\n@HS1family','bot');},500);return;}
if(low.includes('флаппи')||low.includes('игра')){setTimeout(()=>{tr.remove();let b=addMsg('','bot');b.innerHTML='🚀 Флаппи тут! <button onclick="openFlappy()" style="background:#FF8A00;border:0;padding:10px 16px;border-radius:20px;font-weight:800;cursor:pointer">ИГРАТЬ!</button>';},400);return;}
try{let r=await fetch(RENDER_URL+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});let j=await r.json();tr.remove();addMsg(j.answer||'Бро, повтори?','bot');}catch(e){tr.remove();addMsg('Связь тупит, пиши @HS1family','bot');}msgs.scrollTop=msgs.scrollHeight;}
function quick(t){inp.value=t;askZaki();}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')askZaki();});

// === ЗВУКИ - БЕЗ ФАЙЛОВ, ЧИСТЫЙ WEB AUDIO ===
let audioCtx=null, soundOn=true;
function getAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('soundBtn').innerText = soundOn ? '🔊 Звук' : '🔇 Без звука';
  document.getElementById('fPromo').innerHTML = soundOn ? '15 врат = чек <b style="color:#FFB26B">HS1-5GB</b> • Звук включен 🔊' : '15 врат = чек <b style="color:#FFB26B">HS1-5GB</b> • Звук выключен 🔇';
  if(soundOn) playScore();
}
function playFlap(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    // шум газа - как ракета
    let bufferSize=ctx.sampleRate*0.25;
    let buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    let data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,2); }
    let noise=ctx.createBufferSource(); noise.buffer=buffer;
    let filter=ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.setValueAtTime(1800,t); filter.frequency.exponentialRampToValueAtTime(300,t+0.22);
    let gain=ctx.createGain(); gain.gain.setValueAtTime(0.45,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination); noise.start(t);
    // свист вверх
    let osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(350,t); osc.frequency.exponentialRampToValueAtTime(750,t+0.18);
    let og=ctx.createGain(); og.gain.setValueAtTime(0.12,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    osc.connect(og); og.connect(ctx.destination); osc.start(t); osc.stop(t+0.2);
  }catch(e){}
}
function playScore(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    [880,1320].forEach((f,i)=>{
      let osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=f;
      let g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t+i*0.07); g.gain.exponentialRampToValueAtTime(0.28,t+i*0.07+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.07+0.18);
      osc.connect(g); g.connect(ctx.destination); osc.start(t+i*0.07); osc.stop(t+i*0.07+0.2);
    });
    // монетка HS1
    let o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.setValueAtTime(1760,t); o2.frequency.setValueAtTime(1760,t+0.12);
    let g2=ctx.createGain(); g2.gain.setValueAtTime(0.12,t+0.08); g2.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o2.connect(g2); g2.connect(ctx.destination); o2.start(t+0.08); o2.stop(t+0.24);
  }catch(e){}
}
function playHit(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    // БУМ
    let osc=ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(160,t); osc.frequency.exponentialRampToValueAtTime(40,t+0.35);
    let g=ctx.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t+0.4);
    // шум взрыва
    let bufferSize=ctx.sampleRate*0.4;
    let buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    let data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,1.5); }
    let noise=ctx.createBufferSource(); noise.buffer=buffer;
    let filter=ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=800;
    let ng=ctx.createGain(); ng.gain.setValueAtTime(0.4,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    noise.connect(filter); filter.connect(ng); ng.connect(ctx.destination); noise.start(t);
  }catch(e){}
}
function playWin(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    let notes=[523,659,784,1046,784,1046,1318];
    notes.forEach((f,i)=>{
      let osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=f;
      let g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t+i*0.12); g.gain.exponentialRampToValueAtTime(0.25,t+i*0.12+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.35);
      osc.connect(g); g.connect(ctx.destination); osc.start(t+i*0.12); osc.stop(t+i*0.12+0.4);
    });
  }catch(e){}
}
function playClick(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    let osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=1200;
    let g=ctx.createGain(); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t+0.06);
  }catch(e){}
}

let fCanvas=document.getElementById('flappyCanvas'), fCtx=fCanvas.getContext('2d');
let imgZaki=new Image(); imgZaki.src='zaki-run-side.png';
let imgFallback=new Image(); imgFallback.src='zaki.jpg';
imgZaki.onerror=()=>{ imgZaki.src='zaki.jpg'; };
let W=0,H=0, birdY=0, birdV=0, birdX=0, gravity=0.42, jump=-8.6, gates=[], particles=[], score=0, best=parseInt(localStorage.getItem('zaki_flappy_best')||'0'), playing=false, started=false, frame=0, groundOffset=0, isDead=false, deadAlpha=1;
function fResize(){let st=document.getElementById('fStage');let dpr=Math.min(2,window.devicePixelRatio||1);W=st.clientWidth;H=st.clientHeight;fCanvas.width=W*dpr;fCanvas.height=H*dpr;fCanvas.style.width=W+'px';fCanvas.style.height=H+'px';fCtx.setTransform(dpr,0,0,dpr,0,0);birdX=W*0.32;if(!started) birdY=H*0.45;}
function openFlappy(){document.getElementById('flappyOverlay').classList.add('show');fResize();resetFlappy();document.getElementById('fBest').innerText=best;getAudio();playClick();}
function closeFlappy(){document.getElementById('flappyOverlay').classList.remove('show');playing=false;}
function resetFlappy(){birdY=H*0.42;birdV=0;gates=[];particles=[];score=0;started=false;playing=true;frame=0;isDead=false;deadAlpha=1;document.getElementById('fScore').innerText='0';document.getElementById('fBig').innerText='0';document.getElementById('fPromo').innerHTML='15 врат = чек <b style="color:#FFB26B">HS1-5GB</b> • Звук '+(soundOn?'включен 🔊':'выключен 🔇');}
function makeCheck(s){let str=s+'|FLAPPY|HS1';let h=0;for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i);h|=0;}return 'ZAKI-FLAP-'+Math.abs(h).toString(36).toUpperCase()+'-'+s;}
function getFeet(){return {x: birdX+1, y: birdY+44};}
function flap(){
  if(!playing) resetFlappy();
  if(isDead) return;
  started=true; birdV=jump;
  playFlap();
  let f=getFeet();
  for(let i=0;i<22;i++){particles.push({x:f.x+(Math.random()-0.5)*12,y:f.y,vx:(Math.random()-0.5)*1.2,vy:2.5+Math.random()*4.5,life:1,size:6+Math.random()*13,type:Math.random()<0.65?'fire':'smoke'});}
}
document.getElementById('flapBtn').addEventListener('click',flap);
document.getElementById('fStage').addEventListener('pointerdown',e=>{e.preventDefault();flap();});
function addGate(){let gap=168,minH=70,maxH=H-250;let topH=minH+Math.random()*(maxH-minH);gates.push({x:W+20,top:topH,gap:gap,passed:false,w:56,pulse:Math.random()*Math.PI*2});}
function drawFlappy(){
  frame++;
  if(playing && started && !isDead){
    birdV+=gravity; birdY+=birdV; groundOffset+=3.4;
    if(frame%92===0) addGate();
    for(let p of gates){p.x-=3.1; p.pulse+=0.08; if(!p.passed && p.x+p.w < birdX){p.passed=true;score++;playScore();document.getElementById('fScore').innerText=score;document.getElementById('fBig').innerText=score;if(score>best){best=score;localStorage.setItem('zaki_flappy_best',best);document.getElementById('fBest').innerText=best;} if(score===15) playWin();}}
    gates=gates.filter(p=>p.x>-120);
    if(frame%4===0){let f=getFeet(); particles.push({x:f.x+(Math.random()-0.5)*6,y:f.y,vx:(Math.random()-0.5)*0.8,vy:1.5+Math.random()*1.5,life:0.7,size:4+Math.random()*5,type:'smoke'});}
    if(birdY+44>H-62 || birdY-40<0){gameOver();}
    for(let p of gates){if(birdX+28>p.x && birdX-28<p.x+p.w){if(birdY-30 < p.top || birdY+42 > p.top+p.gap) gameOver();}}
  }
  fCtx.fillStyle='#080808'; fCtx.fillRect(0,0,W,H);
  fCtx.fillStyle='#0c0c0d'; for(let x=0;x<W;x+=22){ fCtx.fillRect(x,0,10,H); }
  fCtx.fillStyle='#161617'; for(let x=11;x<W;x+=22){ fCtx.fillRect(x,0,1,H); }
  let glow=fCtx.createRadialGradient(W/2,H+20,10,W/2,H+20,280);
  glow.addColorStop(0,'rgba(255,120,30,0.55)'); glow.addColorStop(0.5,'rgba(255,110,0,0.18)'); glow.addColorStop(1,'rgba(0,0,0,0)');
  fCtx.fillStyle=glow; fCtx.fillRect(0,0,W,H);
  for(let p of gates){ drawGate(p.x, p.top, p.w, p.gap, p.pulse); }
  function drawGate(x, topH, w, gap, pulse){
    let bottomY = topH+gap;
    drawOneGate(x, -10, w, topH+10, true, pulse);
    drawOneGate(x, bottomY, w, H-bottomY, false, pulse);
    let midY = topH + gap/2;
    fCtx.save();
    fCtx.globalAlpha = 0.35 + Math.sin(pulse)*0.15;
    fCtx.strokeStyle='rgba(255,170,90,0.4)'; fCtx.setLineDash([6,8]); fCtx.lineWidth=1.5;
    fCtx.beginPath(); fCtx.moveTo(x+w/2, topH); fCtx.lineTo(x+w/2, bottomY); fCtx.stroke();
    fCtx.setLineDash([]);
    let dotGrad=fCtx.createRadialGradient(x+w/2, midY, 1, x+w/2, midY, 18);
    dotGrad.addColorStop(0,'rgba(255,220,150,0.9)'); dotGrad.addColorStop(1,'rgba(255,120,0,0)');
    fCtx.fillStyle=dotGrad; fCtx.beginPath(); fCtx.arc(x+w/2, midY, 14, 0, Math.PI*2); fCtx.fill();
    fCtx.restore();
  }
  function drawOneGate(x, y, w, h, isTop, pulse){
    let r=18;
    fCtx.save();
    fCtx.shadowColor='rgba(255,120,0,0.55)'; fCtx.shadowBlur=22;
    let g=fCtx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,'rgba(25,22,18,0.96)'); g.addColorStop(0.25,'rgba(255,255,255,0.14)'); g.addColorStop(0.5,'rgba(255,255,255,0.05)'); g.addColorStop(1,'rgba(10,10,10,0.98)');
    roundRect(x,y,w,h,r); fCtx.fillStyle=g; fCtx.fill();
    fCtx.restore();
    fCtx.save();
    roundRect(x,y,w,h,r); fCtx.strokeStyle='rgba(255,170,90,0.95)'; fCtx.lineWidth=1.6; fCtx.stroke();
    fCtx.restore();
    let capH=52, capW=w+16, capX=x-8, capY=isTop?y+h-capH:y;
    fCtx.save();
    fCtx.shadowColor='rgba(255,120,0,0.65)'; fCtx.shadowBlur=16;
    let capGrad=fCtx.createLinearGradient(capX,0,capX+capW,0);
    capGrad.addColorStop(0,'rgba(255,255,255,0.18)'); capGrad.addColorStop(0.4,'rgba(255,150,50,0.35)'); capGrad.addColorStop(1,'rgba(0,0,0,0.5)');
    roundRect(capX,capY,capW,capH,14); fCtx.fillStyle=capGrad; fCtx.fill();
    fCtx.strokeStyle='rgba(255,180,100,1)'; fCtx.lineWidth=1.5; fCtx.stroke();
    fCtx.restore();
    fCtx.save();
    fCtx.textAlign='center'; fCtx.textBaseline='middle';
    fCtx.fillStyle='#FF8A00'; fCtx.beginPath(); fCtx.arc(capX+capW/2, capY+16, 9, 0, Math.PI*2); fCtx.fill();
    fCtx.fillStyle='#000'; fCtx.font='800 10px Inter'; fCtx.fillText('⚡', capX+capW/2, capY+17);
    fCtx.fillStyle='#FFB26B'; fCtx.font='800 10px Unbounded'; fCtx.fillText('HS1', capX+capW/2, capY+36);
    fCtx.restore();
  }
  function roundRect(x,y,w,h,r){ fCtx.beginPath(); fCtx.moveTo(x+r,y); fCtx.lineTo(x+w-r,y); fCtx.quadraticCurveTo(x+w,y,x+w,y+r); fCtx.lineTo(x+w,y+h-r); fCtx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); fCtx.lineTo(x+r,y+h); fCtx.quadraticCurveTo(x,y+h,x,y+h-r); fCtx.lineTo(x,y+r); fCtx.quadraticCurveTo(x,y,x+r,y); fCtx.closePath(); }
  let groundY=H-62;
  fCtx.fillStyle='#0a0a0a'; fCtx.fillRect(0,groundY,W,62);
  fCtx.fillStyle='rgba(255,170,90,0.7)'; fCtx.fillRect(0,groundY,W,2);
  for(let i=particles.length-1;i>=0;i--){
    let pt=particles[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.life-=0.028; pt.size*=0.97;
    if(pt.life<=0){particles.splice(i,1);continue;}
    if(pt.type==='fire'){
      let fg=fCtx.createRadialGradient(pt.x,pt.y,1,pt.x,pt.y,pt.size);
      fg.addColorStop(0,'rgba(255,245,200,'+pt.life+')');
      fg.addColorStop(0.35,'rgba(255,160,20,'+(pt.life*0.95)+')');
      fg.addColorStop(1,'rgba(255,40,0,0)');
      fCtx.fillStyle=fg; fCtx.beginPath(); fCtx.arc(pt.x,pt.y,pt.size,0,Math.PI*2); fCtx.fill();
    } else {
      fCtx.fillStyle='rgba(255,255,255,'+(pt.life*0.4)+')'; fCtx.beginPath(); fCtx.arc(pt.x,pt.y,pt.size*0.65,0,Math.PI*2); fCtx.fill();
    }
  }
  if(!isDead || deadAlpha>0){
    let rot = isDead ? 0.6 : Math.max(-0.15, Math.min(0.25, birdV*0.02));
    fCtx.save();
    fCtx.globalAlpha = deadAlpha;
    fCtx.translate(birdX,birdY);
    fCtx.rotate(rot);
    fCtx.shadowColor='rgba(255,120,0,0.75)'; fCtx.shadowBlur=20;
    let img=(imgZaki.complete && imgZaki.naturalWidth>0)?imgZaki:imgFallback;
    if(img.complete && img.naturalWidth>0){
      fCtx.drawImage(img,-44,-48,88,96);
    }
    fCtx.restore();
    if(started && playing && !isDead){
      let f=getFeet();
      let flameLen=20+Math.random()*18;
      fCtx.save(); fCtx.translate(f.x,f.y);
      let fl=fCtx.createLinearGradient(0,0,0,flameLen);
      fl.addColorStop(0,'rgba(255,240,180,0.98)'); fl.addColorStop(0.35,'rgba(255,140,0,0.9)'); fl.addColorStop(1,'rgba(255,50,0,0)');
      fCtx.fillStyle=fl;
      fCtx.beginPath(); fCtx.moveTo(-8,0); fCtx.lineTo(0,flameLen); fCtx.lineTo(8,0); fCtx.closePath(); fCtx.fill();
      fCtx.restore();
    }
  }
  if(!started && playing){
    fCtx.fillStyle='#fff'; fCtx.font='900 22px Unbounded'; fCtx.textAlign='center'; fCtx.shadowColor='rgba(255,120,0,0.6)'; fCtx.shadowBlur=16; fCtx.fillText('ТАПАЙ!',W/2,H*0.28); fCtx.shadowBlur=0;
  }
}
function gameOver(){
  if(isDead) return;
  isDead=true; playing=false;
  playHit();
  for(let i=0;i<36;i++) particles.push({x:birdX,y:birdY,vx:(Math.random()-0.5)*9,vy:(Math.random()-0.5)*9,life:1,size:6+Math.random()*10,type:'fire'});
  let fade=setInterval(()=>{ deadAlpha-=0.09; if(deadAlpha<=0){ deadAlpha=0; clearInterval(fade); } },30);
  if(score>=15){
    playWin();
    let ch=makeCheck(score);
    document.getElementById('fPromo').innerHTML='🏆 '+score+' врат! ЛЕГЕНДА!<br>Чек: <b style="color:#FFB26B">'+ch+'</b><br><button onclick="navigator.clipboard.writeText(\''+ch+'\');this.innerText=\'Скопировано ✓\'" style="background:#FF9A35;border:0;padding:8px 14px;border-radius:12px;font-weight:800;margin-top:6px;cursor:pointer">КОПИРОВАТЬ ЧЕК</button>';
  } else {
    document.getElementById('fPromo').innerHTML='💥 '+score+' врат. Нужно 15 для чека. Тапай ГАЗ чтобы еще раз!';
  }
}
setInterval(()=>{if(document.getElementById('flappyOverlay').classList.contains('show')) drawFlappy();},1000/60);
window.addEventListener('resize',()=>{if(document.getElementById('flappyOverlay').classList.contains('show')) fResize();});
fResize();
</script>
