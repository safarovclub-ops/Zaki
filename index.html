<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Zaki</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Great+Vibes&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#050505;font-family:'Inter',sans-serif;display:flex;justify-content:center;color:#fff;overflow:hidden}
.chat{position:relative;width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:repeating-linear-gradient(90deg,#0c0c0d 0px,#0c0c0d 10px,#161617 11px,#161617 12px,#080808 13px,#080808 22px),#000}
.chat:before{content:'';position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 110%,rgba(255,120,30,.42),transparent 55%)}
.chat>*{position:relative;z-index:1}
.head{margin:14px 18px 0;padding:14px 18px;display:flex;align-items:center;gap:15px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(28px);border-radius:26px;border:1.2px solid rgba(255,170,90,.85);flex-shrink:0}
.avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;background:transparent;flex-shrink:0;border:1px solid rgba(255,140,0,.5);box-shadow:0 0 24px rgba(255,120,0,.8)}
.info{flex:1}.info h1{font-size:26px;font-weight:600}.info .st{font-size:15px;margin-top:6px;color:#D8D8DE}.info .st b{color:#FF9B4A}
#msgs{flex:1;overflow-y:auto;padding:20px 14px 14px 18px;display:flex;flex-direction:column;gap:24px;overscroll-behavior:contain}
.row{display:flex;gap:12px;align-items:flex-start;max-width:88%}
.mini{width:52px;height:52px;min-width:52px;border-radius:50%;object-fit:cover;background:transparent;box-shadow:0 0 18px rgba(255,120,0,.65);border:1px solid rgba(255,140,0,.4)}
.msg{padding:19px 20px;font-size:16.5px;line-height:1.55;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));backdrop-filter:blur(22px);border:1.2px solid rgba(255,170,90,.75);white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;margin-left:auto;background:linear-gradient(135deg,#FF9A35,#FF6A00);color:#000;border:0;font-weight:600}
.msg a{color:#FFB26B;word-break:break-all}
.msg.user a{color:#000}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:10px}
.blobStage{width:150px;height:150px;position:relative}
.blob{width:118px;height:118px;position:absolute;top:16px;left:16px;background:transparent;border-radius:42% 58% 55% 45% / 48% 42% 58% 52%;animation:blobMorph 5s ease-in-out infinite;box-shadow:0 0 32px rgba(255,120,0,.45);border:1px solid rgba(255,140,0,.5);overflow:hidden}
.blob img{width:100%;height:100%;object-fit:cover;display:block;background:transparent}
@keyframes blobMorph{0%,100%{border-radius:42% 58% 55% 45% / 48% 42% 58% 52%}33%{border-radius:58% 42% 45% 55% / 52% 58% 42% 48%}66%{border-radius:48% 52% 60% 40% / 45% 55% 48% 52%}}
.blobShadow{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:90px;height:14px;background:rgba(0,0,0,.5);border-radius:50%;filter:blur(8px)}
.salam{font-family:'Great Vibes',cursive;font-size:32px;line-height:1;margin-top:14px;background:linear-gradient(135deg,#FFE8C2,#FF9A35,#FF6A00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transform:rotate(-2deg)}
.empty h2{font-size:27px;font-weight:600;margin-top:2px}
.empty p{font-size:14.5px;color:#A8A8B0;margin-top:8px}
.glassHint{margin-top:14px;padding:10px 16px;border-radius:100px;background:rgba(255,255,255,.07);border:1px solid rgba(255,170,90,.4);font-size:13px;cursor:pointer}
.bottom{padding:10px 18px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;background:linear-gradient(to top, #050505 60%, transparent)}
.inputWrap{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 22px;border-radius:100px;background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1.2px solid rgba(255,170,90,.75)}
.inputWrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16.5px;padding:15px 0}
.send{width:52px;height:52px;min-width:52px;border-radius:50%;background:linear-gradient(135deg,#FF9A35,#FF6A00);border:none;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chips{display:flex;gap:8px;padding:0 18px 10px;flex-wrap:wrap;flex-shrink:0}
.chips span{font-size:13px;padding:10px 14px;border-radius:100px;background:rgba(255,255,255,.07);border:1px solid rgba(255,170,90,.45);cursor:pointer}
.typing{display:flex;gap:5px;padding:4px 2px}.typing i{width:8px;height:8px;border-radius:50%;background:#FF9A35;animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
#flappyOverlay{position:absolute;inset:0;z-index:100;display:none;flex-direction:column;background:#000}
#flappyOverlay:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0c0c0d 0px,#0c0c0d 10px,#161617 11px,#161617 12px,#080808 13px,#080808 22px),radial-gradient(ellipse at 50% 110%,rgba(255,120,30,.45),transparent 55%)}
#flappyOverlay>*{position:relative;z-index:1}
#flappyOverlay.show{display:flex}
.f-top{margin:20px 14px 0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(28px);border-radius:22px;border:1.2px solid rgba(255,170,90,.85)}
.f-close{background:rgba(255,255,255,.1);border:1px solid rgba(255,170,90,.6);color:#fff;padding:8px 14px;border-radius:100px;cursor:pointer;font-size:13px}
.soundBtn{background:rgba(255,170,90,.2);border:1px solid rgba(255,170,90,.6);color:#fff;padding:8px 12px;border-radius:100px;cursor:pointer;font-size:14px}
.f-score{display:flex;gap:8px;padding:12px 14px}
.f-box{flex:1;text-align:center;padding:11px 4px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1.2px solid rgba(255,170,90,.6)}
.f-box b{color:#FFB26B;font-size:22px;display:block;font-family:'Unbounded'}
.f-box span{font-size:10px;color:#aaa;font-weight:700;letter-spacing:.8px}
.f-stage{flex:1;margin:0 14px;border-radius:24px;border:1.2px solid rgba(255,170,90,.85);overflow:hidden;position:relative}
#flappyCanvas{width:100%;height:100%;display:block;touch-action:none}
.f-hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none}
.f-bigScore{font-family:'Unbounded';font-size:56px;font-weight:800;color:#fff;text-shadow:0 0 24px rgba(255,120,0,.6),0 4px 0 rgba(0,0,0,.4);line-height:1}
.f-promo{margin:10px 14px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,170,90,.6);text-align:center;font-size:12.5px}
.f-btns{padding:12px 14px 22px;display:flex;gap:8px}
.f-big{flex:1.6;padding:17px;border-radius:20px;border:0;background:linear-gradient(180deg,#ffcf7a,#ff8a00);color:#000;font-weight:800;font-size:17px;cursor:pointer}
.f-btn{flex:1;padding:17px;border-radius:20px;border:1.2px solid rgba(255,170,90,.75);background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="chat">
  <div class="head"><img class="avatar" src="zaki.jpg" onerror="this.src='zaki.png'"><div class="info"><h1>Zaki</h1><div class="st"><b>В сети</b> • Активен сейчас</div></div></div>
  <div id="msgs">
    <div class="empty" id="empty">
      <div class="blobStage"><div class="blob"><img src="zaki.jpg" onerror="this.src='zaki.png'"></div><div class="blobShadow"></div></div>
      <div class="salam">Асалому алайкум</div>
      <h2>я Zaki</h2>
      <p>Чем помочь?<br>Скорость, приватность</p>
      <div class="glassHint" onclick="quick('Как скачать приложение?')">✨ Напиши ниже — я на связи</div>
      <div onclick="openFlappy()" style="margin-top:12px;padding:14px 22px;border-radius:100px;background:linear-gradient(180deg,#ffcf7a,#ff8a00);color:#000;font-weight:800;cursor:pointer">🚀 FLAPPY ZAKI — 5GB! 🔊</div>
    </div>
  </div>
  <div class="chips">
    <span onclick="quick('Как скачать приложение?')">📲 Скачать приложение</span>
    <span onclick="quick('Тарифы?')">💳 Тарифы</span>
    <span onclick="openFlappy()" style="background:linear-gradient(135deg,#FF9A35,#FF6A00);color:#000;font-weight:800">🚀 FLAPPY — ИГРАТЬ!</span>
  </div>
  <div class="bottom"><div class="inputWrap"><input id="inp" placeholder="Написать Zaki..." autocomplete="off"><button class="send" onclick="askZaki()">➤</button></div></div>

  <div id="flappyOverlay">
    <div class="f-top"><button class="f-close" onclick="closeFlappy()">← Назад</button><b style="font-family:'Unbounded';font-size:13px">🚀 FLAPPY ZAKI</b><button class="soundBtn" id="soundBtn" onclick="toggleSound()">🔊 Звук</button></div>
    <div class="f-score">
      <div class="f-box"><span>СЧЕТ</span><b id="fScore">0</b></div>
      <div class="f-box"><span>РЕКОРД</span><b id="fBest">0</b></div>
      <div class="f-box"><span>5GB при</span><b>15</b></div>
    </div>
    <div class="f-stage" id="fStage">
      <canvas id="flappyCanvas"></canvas>
      <div class="f-hud"><div class="f-bigScore" id="fBig">0</div></div>
    </div>
    <div class="f-promo" id="fPromo">15 врат = чек <b style="color:#FFB26B">HS1-5GB</b> • Звук включен 🔊</div>
    <div class="f-btns"><button class="f-btn" onclick="resetFlappy()">↻</button><button class="f-big" id="flapBtn">🚀 ГАЗ! ЛЕТЕТЬ!</button></div>
  </div>
</div>
<script>
const RENDER_URL="https://hs1vpn-bot-1.onrender.com";
const inp=document.getElementById('inp'), msgs=document.getElementById('msgs'), emptyDiv=document.getElementById('empty');
function hideEmpty(){if(emptyDiv)emptyDiv.style.display='none'}
function addMsg(t,w){
  hideEmpty();
  if(w==='user'){let d=document.createElement('div');d.className='msg user';d.textContent=t;msgs.appendChild(d);}
  else{let r=document.createElement('div');r.className='row';r.innerHTML=`<img class="mini" src="zaki.jpg" onerror="this.src='zaki.png'"><div class="msg"></div>`;let m=r.querySelector('.msg');m.textContent=t;m.innerHTML=t.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>');msgs.appendChild(r);}
  msgs.scrollTop=msgs.scrollHeight;
}
function addTyping(){hideEmpty();let r=document.createElement('div');r.className='row';r.innerHTML=`<img class="mini" src="zaki.jpg"><div class="msg"><div class="typing"><i></i><i></i><i></i></div></div>`;msgs.appendChild(r);msgs.scrollTop=msgs.scrollHeight;return r;}

// === ИСПРАВЛЕННЫЙ askZaki - ТЕПЕРЬ ВСЁ ЧЕРЕЗ ZAKI ULTRA PRO ===
async function askZaki(){
  let q=inp.value.trim();if(!q)return;
  addMsg(q,'user');inp.value='';
  // держим поле на месте когда клава
  setTimeout(()=>{inp.focus({preventScroll:true});},10);
  let tr=addTyping();
  let low=q.toLowerCase();
  // Только игра локально, остальное всё в Groq
  if(low.includes('флаппи')||low.includes('игра')||low.includes('flappy')){
    setTimeout(()=>{tr.remove();let b=addMsg('','bot');b.innerHTML='🚀 Флаппи тут! <button onclick="openFlappy()" style="background:#FF8A00;border:0;padding:10px 16px;border-radius:20px;font-weight:800;cursor:pointer">ИГРАТЬ!</button>';},400);
    return;
  }
  try{
    let r=await fetch(RENDER_URL+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
    let j=await r.json();tr.remove();addMsg(j.answer||'Бро, повтори?','bot');
  }catch(e){tr.remove();addMsg('Связь тупит, пиши @HS1family','bot');}
  msgs.scrollTop=msgs.scrollHeight;
}
function quick(t){inp.value=t;askZaki();}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();askZaki();}});
// === ЧТОБЫ ПОЛЕ НЕ УБЕГАЛО НА ТЕЛЕФОНЕ ===
if(window.visualViewport){
  const vv=window.visualViewport;
  function fixH(){
    document.querySelector('.chat').style.height=vv.height+'px';
    msgs.scrollTop=msgs.scrollHeight;
  }
  vv.addEventListener('resize',fixH); vv.addEventListener('scroll',fixH);
  fixH();
}
inp.addEventListener('focus',()=>{setTimeout(()=>{msgs.scrollTop=msgs.scrollHeight;},300)});

// === ЗВУКИ - БЕЗ ФАЙЛОВ, ЧИСТЫЙ WEB AUDIO ===
let audioCtx=null, soundOn=true;
function getAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('soundBtn').innerText = soundOn ? '🔊 Звук' : '🔇 Без звука';
  document.getElementById('fPromo').innerHTML = soundOn ? '15 врат = чек <b style="color:#FFB26B">HS1-5GB</b> • Звук включен 🔊' : '15 врат = чек <b style="color:#FFB26B">HS1-5GB</b> • Звук выключен 🔇';
  if(soundOn) playScore();
}
function playFlap(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    let bufferSize=ctx.sampleRate*0.25;
    let buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    let data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,2); }
    let noise=ctx.createBufferSource(); noise.buffer=buffer;
    let filter=ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.setValueAtTime(1800,t); filter.frequency.exponentialRampToValueAtTime(300,t+0.22);
    let gain=ctx.createGain(); gain.gain.setValueAtTime(0.45,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination); noise.start(t);
    let osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(350,t); osc.frequency.exponentialRampToValueAtTime(750,t+0.18);
    let og=ctx.createGain(); og.gain.setValueAtTime(0.12,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    osc.connect(og); og.connect(ctx.destination); osc.start(t); osc.stop(t+0.2);
  }catch(e){}
}
function playScore(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    [880,1320].forEach((f,i)=>{
      let osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=f;
      let g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t+i*0.07); g.gain.exponentialRampToValueAtTime(0.28,t+i*0.07+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.07+0.18);
      osc.connect(g); g.connect(ctx.destination); osc.start(t+i*0.07); osc.stop(t+i*0.07+0.2);
    });
    let o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.setValueAtTime(1760,t); o2.frequency.setValueAtTime(1760,t+0.12);
    let g2=ctx.createGain(); g2.gain.setValueAtTime(0.12,t+0.08); g2.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o2.connect(g2); g2.connect(ctx.destination); o2.start(t+0.08); o2.stop(t+0.24);
  }catch(e){}
}
function playHit(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    let osc=ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.setValueAtTime(160,t); osc.frequency.exponentialRampToValueAtTime(40,t+0.35);
    let g=ctx.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t+0.4);
    let bufferSize=ctx.sampleRate*0.4;
    let buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    let data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,1.5); }
    let noise=ctx.createBufferSource(); noise.buffer=buffer;
    let filter=ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=800;
    let ng=ctx.createGain(); ng.gain.setValueAtTime(0.4,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    noise.connect(filter); filter.connect(ng); ng.connect(ctx.destination); noise.start(t);
  }catch(e){}
}
function playWin(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    let notes=[523,659,784,1046,784,1046,1318];
    notes.forEach((f,i)=>{
      let osc=ctx.createOscillator(); osc.type='triangle'; osc.frequency.value=f;
      let g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t+i*0.12); g.gain.exponentialRampToValueAtTime(0.25,t+i*0.12+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.35);
      osc.connect(g); g.connect(ctx.destination); osc.start(t+i*0.12); osc.stop(t+i*0.12+0.4);
    });
  }catch(e){}
}
function playClick(){
  if(!soundOn) return;
  try{
    let ctx=getAudio(), t=ctx.currentTime;
    let osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=1200;
    let g=ctx.createGain(); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t+0.06);
  }catch(e){}
}

let fCanvas=document.getElementById('flappyCanvas'), fCtx=fCanvas.getContext('2d');
let imgZaki=new Image(); imgZaki.src='zaki-run-side.png';
let imgFallback=new Image(); imgFallback.src='zaki.jpg';
imgZaki.onerror=()=>{ imgZaki.src='zaki.jpg'; };
let W=0,H=0, birdY=0, birdV=0, birdX=0, gravity=0.42, jump=-8.6, gates=[], particles=[], score=0, best=parseInt(localStorage.getItem('zaki_flappy_best')||'0'), playing=false, started=false, frame=0, groundOffset=0, isDead=false, deadAlpha=1;
function fResize(){let st=document.getElementById('fStage');let dpr=Math.min(2,window.devicePixelRatio||1);W=st.clientWidth;H=st.clientHeight;fCanvas.width=W*dpr;fCanvas.height=H*dpr;fCanvas.style.width=W+'px';fCanvas.style.height=H+'px';fCtx.setTransform(dpr,0,0,dpr,0,0);birdX=W*0.32;if(!started) birdY=H*0.45;}
function openFlappy(){document.getElementById('flappyOverlay').classList.add('show');fResize();resetFlappy();document.getElementById('fBest').innerText=best;getAudio();playClick();}
function closeFlappy(){document.getElementById('flappyOverlay').classList.remove('show');playing=false;}
function resetFlappy(){birdY=H*0.42;birdV=0;gates=[];particles=[];score=0;started=false;playing=true;frame=0;isDead=false;deadAlpha=1;document.getElementById('fScore').innerText='0';document.getElementById('fBig').innerText='0';document.getElementById('fPromo').innerHTML='15 врат = чек <b style="color:#FFB26B">HS1-5GB</b> • Звук '+(soundOn?'включен 🔊':'выключен 🔇');}
function makeCheck(s){let str=s+'|FLAPPY|HS1';let h=0;for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i);h|=0;}return 'ZAKI-FLAP-'+Math.abs(h).toString(36).toUpperCase()+'-'+s;}
function getFeet(){return {x: birdX+1, y: birdY+44};}
function flap(){
  if(!playing) resetFlappy();
  if(isDead) return;
  started=true; birdV=jump;
  playFlap();
  let f=getFeet();
  for(let i=0;i<22;i++){particles.push({x:f.x+(Math.random()-0.5)*12,y:f.y,vx:(Math.random()-0.5)*1.2,vy:2.5+Math.random()*4.5,life:1,size:6+Math.random()*13,type:Math.random()<0.65?'fire':'smoke'});}
}
document.getElementById('flapBtn').addEventListener('click',flap);
document.getElementById('fStage').addEventListener('pointerdown',e=>{e.preventDefault();flap();});
function addGate(){let gap=168,minH=70,maxH=H-250;let topH=minH+Math.random()*(maxH-minH);gates.push({x:W+20,top:topH,gap:gap,passed:false,w:56,pulse:Math.random()*Math.PI*2});}
function drawFlappy(){
  frame++;
  if(playing && started && !isDead){
    birdV+=gravity; birdY+=birdV; groundOffset+=3.4;
    if(frame%92===0) addGate();
    for(let p of gates){p.x-=3.1; p.pulse+=0.08; if(!p.passed && p.x+p.w < birdX){p.passed=true;score++;playScore();document.getElementById('fScore').innerText=score;document.getElementById('fBig').innerText=score;if(score>best){best=score;localStorage.setItem('zaki_flappy_best',best);document.getElementById('fBest').innerText=best;} if(score===15) playWin();}}
    gates=gates.filter(p=>p.x>-120);
    if(frame%4===0){let f=getFeet(); particles.push({x:f.x+(Math.random()-0.5)*6,y:f.y,vx:(Math.random()-0.5)*0.8,vy:1.5+Math.random()*1.5,life:0.7,size:4+Math.random()*5,type:'smoke'});}
    if(birdY+44>H-62 || birdY-40<0){gameOver();}
    for(let p of gates){if(birdX+28>p.x && birdX-28<p.x+p.w){if(birdY-30 < p.top || birdY+42 > p.top+p.gap) gameOver();}}
  }
  fCtx.fillStyle='#080808'; fCtx.fillRect(0,0,W,H);
  fCtx.fillStyle='#0c0c0d'; for(let x=0;x<W;x+=22){ fCtx.fillRect(x,0,10,H); }
  fCtx.fillStyle='#161617'; for(let x=11;x<W;x+=22){ fCtx.fillRect(x,0,1,H); }
  let glow=fCtx.createRadialGradient(W/2,H+20,10,W/2,H+20,280);
  glow.addColorStop(0,'rgba(255,120,30,0.55)'); glow.addColorStop(0.5,'rgba(255,110,0,0.18)'); glow.addColorStop(1,'rgba(0,0,0,0)');
  fCtx.fillStyle=glow; fCtx.fillRect(0,0,W,H);
  for(let p of gates){ drawGate(p.x, p.top, p.w, p.gap, p.pulse); }
  function drawGate(x, topH, w, gap, pulse){
    let grad=fCtx.createLinearGradient(x,0,x+w,0);
    grad.addColorStop(0,'#FF8A00'); grad.addColorStop(1,'#FF6A00');
    fCtx.fillStyle=grad;
    fCtx.fillRect(x,0,w,topH);
    fCtx.fillRect(x,topH+gap,w,H-(topH+gap)-62);
    fCtx.fillStyle='rgba(255,255,255,0.18)'; fCtx.fillRect(x,0,3,topH); fCtx.fillRect(x,topH+gap,3,H-(topH+gap)-62);
  }
  for(let i=particles.length-1;i>=0;i--){let pt=particles[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.life-=0.03;if(pt.life<=0){particles.splice(i,1);continue;}fCtx.globalAlpha=pt.life;if(pt.type==='fire'){fCtx.fillStyle='#FF8A00';}else{fCtx.fillStyle='rgba(255,255,255,0.35)';}fCtx.beginPath();fCtx.arc(pt.x,pt.y,pt.size*pt.life,0,Math.PI*2);fCtx.fill();fCtx.globalAlpha=1;}
  let scale=1+Math.sin(frame*0.2)*0.03;
  fCtx.save(); fCtx.translate(birdX,birdY); fCtx.rotate(Math.max(-0.4,Math.min(0.5,birdV*0.04))); fCtx.scale(scale,scale);
  let img=(imgZaki.complete && imgZaki.naturalWidth>0)?imgZaki:imgFallback;
  fCtx.drawImage(img,-34,-34,68,68);
  fCtx.restore();
  fCtx.fillStyle='#111'; fCtx.fillRect(0,H-62,W,62);
  fCtx.fillStyle='#FF8A00'; fCtx.fillRect(0,H-62,W,3);
  fCtx.fillStyle='#1a1a1a'; for(let x=-(groundOffset%24);x<W;x+=24){fCtx.fillRect(x,H-40,14,18);}
  if(!started && !isDead){fCtx.fillStyle='rgba(255,255,255,0.9)';fCtx.font='700 16px Inter';fCtx.textAlign='center';fCtx.fillText('ТАПНИ - ЛЕТИМ!',W/2,H*0.22);}
  if(isDead){fCtx.fillStyle=`rgba(0,0,0,${1-deadAlpha})`;fCtx.fillRect(0,0,W,H);fCtx.fillStyle='#fff';fCtx.font='800 26px Unbounded';fCtx.textAlign='center';fCtx.fillText('БУМ!',W/2,H*0.35);fCtx.font='600 14px Inter';fCtx.fillText('Счет: '+score,W/2,H*0.35+28);if(score>=15){fCtx.fillStyle='#FFB26B';fCtx.font='800 15px Inter';fCtx.fillText('ЧЕК: '+makeCheck(score),W/2,H*0.35+52);}}
  requestAnimationFrame(drawFlappy);
}
function gameOver(){
  if(isDead) return; isDead=true; playHit(); deadAlpha=1;
  let a=setInterval(()=>{deadAlpha-=0.05; if(deadAlpha<=0) clearInterval(a);},20);
  setTimeout(()=>{playing=false;},600);
}
fResize(); drawFlappy();
window.addEventListener('resize',fResize);
</script>
